version: "3.9"

services:

  db:
    image: mariadb:10.11
    container_name: hng-db
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=64M
      --innodb-log-file-size=32M
      --innodb-flush-method=fsync
      --tmp-table-size=32M
      --max-heap-table-size=32M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:-nextcloudpassword}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud:
    image: kefaslungu/hng-nextcloud:latest
    container_name: hng-nextcloud
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:-nextcloudpassword}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-adminpassword}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SERVER_IP:-localhost} localhost nginx
      OVERWRITEPROTOCOL: http
      OVERWRITEHOST: ${SERVER_IP:-localhost}
    volumes:
      - nextcloud-data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    networks:
      - internal
      - app

  nginx:
    image: nginx:1.25-alpine
    container_name: hng-nginx
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
    networks:
      - app
      - external

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    image: hng-detector:latest
    container_name: hng-detector
    restart: unless-stopped
    depends_on:
      - nginx
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
      - detector-audit:/var/log/detector
      - ./detector/config.yaml:/app/config.yaml:ro
    environment:
      DETECTOR_CONFIG: /app/config.yaml
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

volumes:
  HNG-nginx-logs:
    driver: local
  nextcloud-data:
    driver: local
  db-data:
    driver: local
  detector-audit:
    driver: local

networks:
  internal:
    driver: bridge
  app:
    driver: bridge
  external:
    driver: bridge